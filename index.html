<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Метод Ульяновой · Демо-презентация для клиента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: #00091F;
    --card: #051B43;
    --plate: #12356C;
    --gold-hi: #F0D896;
    --gold: #D2AC5F;
    --cream: #F4EDD8;
    --ink: #C6BFA8;
    --ink-lo: #7F7A6B;
    --hairline: rgba(240, 216, 150, 0.14);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--stage);
    color: var(--cream);
    font-family: 'Montserrat', -apple-system, Segoe UI, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ============ ШАПКА С ВКЛАДКАМИ ============ */
  header.topbar {
    flex: 0 0 auto;
    padding: 10px 24px;
    border-bottom: 1px solid var(--hairline);
    background: linear-gradient(180deg, rgba(5, 13, 36, .98) 0%, rgba(5, 13, 36, .92) 100%);
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: baseline; gap: 12px;
  }
  .brand-mark {
    font-size: 10px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold-hi);
  }
  .brand-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: 17px; line-height: 1.2;
    color: var(--cream);
  }
  .brand-title em { color: var(--gold-hi); font-style: italic; }

  nav.tabs {
    display: flex; gap: 0;
    border: 1px solid var(--hairline);
    border-radius: 2px;
    overflow: hidden;
  }
  nav.tabs button {
    background: transparent;
    border: 0;
    padding: 10px 22px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
  }
  nav.tabs button + button { border-left: 1px solid var(--hairline); }
  nav.tabs button:hover { color: var(--gold-hi); background: rgba(240, 216, 150, .04); }
  nav.tabs button.on {
    background: linear-gradient(180deg, rgba(18, 53, 108, .5), rgba(5, 13, 36, .3));
    color: var(--gold-hi);
    box-shadow: inset 0 -2px 0 var(--gold-hi);
  }
  .side-link {
    font-size: 11px; color: var(--ink-lo);
    text-decoration: none; letter-spacing: 1px;
    padding: 6px 10px; border: 1px solid var(--hairline);
    transition: all .18s;
  }
  .side-link:hover { color: var(--gold-hi); border-color: var(--gold); }

  /* ============ ПОЛНОЭКРАННЫЕ ПАНЕЛИ ============ */
  main.stage {
    flex: 1 1 auto;
    position: relative;
    background: var(--card);
    min-height: 0;
  }
  .pane {
    position: absolute; inset: 0;
    display: block;
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s;
  }
  .pane.on {
    opacity: 1;
    visibility: visible;
  }
  .pane iframe {
    width: 100%; height: 100%;
    border: 0; display: block;
    background: var(--card);
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">MMXXVI · Demo</span>
    <div class="brand-title">Метод Ульяновой · <em>Демо для клиента</em></div>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" data-tab="p1" class="on" role="tab" aria-selected="true">Этап 1 · Брендбук</button>
    <button type="button" data-tab="p2" role="tab" aria-selected="false">Этап 2 · Выбранное в итоге</button>
  </nav>
  <a class="side-link" id="open-current" href="brandbook.html" target="_blank" rel="noopener">Открыть отдельно ↗</a>
</header>

<main class="stage">
  <div class="pane on" id="p1">
    <iframe src="brandbook.html" title="Этап 1 · Брендбук"></iframe>
  </div>
  <div class="pane" id="p2">
    <iframe src="etap-2-unified.html" title="Этап 2 · Выбранное в итоге"></iframe>
  </div>
</main>

<script>
// Tabs
(() => {
  const tabs = document.querySelectorAll('nav.tabs button');
  const panes = { p1: document.getElementById('p1'), p2: document.getElementById('p2') };
  const link = document.getElementById('open-current');
  const urls = {
    p1: '../index.html',
    p2: 'etap-2-unified.html'
  };
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.tab;
      tabs.forEach(b => {
        const active = b.dataset.tab === id;
        b.classList.toggle('on', active);
        b.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      Object.entries(panes).forEach(([key, el]) => {
        el.classList.toggle('on', key === id);
      });
      link.href = urls[id];
    });
  });
})();

// Этап 2 = локальная копия etap-2-unified.html с брендбуковскими стилями (файл уже унифицирован, inject не нужен)
</script>

</body>
</html>
